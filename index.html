<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅剧云</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="nav">
    <div class="logo">阅剧云</div>
    <input class="search" id="searchInput" placeholder="搜索小说 / 短剧">
    <button class="menu-btn" id="menuBtn">☰</button>
  </div>
</header>

<section class="hero">
  <h1>小说 · 短剧</h1>
  <p>24 本小说 · 27 部短剧</p>
</section>

<section id="novels">
  <div class="container">
    <h2>📖 热门小说</h2>
    <div class="grid" id="novelList"></div>
  </div>
</section>

<section id="dramas">
  <div class="container">
    <h2>🎬 精品短剧</h2>
    <div class="grid" id="dramaList"></div>
  </div>
</section>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" id="modalClose">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="reader" id="reader">
  <div class="reader-header">
    <span id="readerTitle"></span>
    <button id="readerClose">×</button>
  </div>
  <div class="reader-body" id="readerBody"></div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
