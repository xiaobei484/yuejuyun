<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>阅剧云 · 小说短剧</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="nav">
    <div class="logo">阅剧云</div>
    <input class="search" id="searchInput" placeholder="搜索小说 / 短剧 / 作者 / 演员">
    <button class="menu-btn" id="menuBtn">☰</button>
  </div>
</header>

<nav class="nav-menu" id="navMenu">
  <a href="#novels">小说</a>
  <a href="#dramas">短剧</a>
  <a href="#rank">排行榜</a>
</nav>

<section class="hero">
  <h1>现代主流 · 小说短剧</h1>
  <div class="stats">
    <div class="stat"><b id="novelCount">0</b><span>本小说</span></div>
    <div class="stat"><b id="dramaCount">0</b><span>部短剧</span></div>
    <div class="stat"><b id="tagCount">0</b><span>个分类</span></div>
  </div>
</section>

<section id="novels">
  <div class="container">
    <h2>📖 热门小说</h2>
    <div class="tags" id="novelTags"></div>
    <div class="grid" id="novelList"></div>
  </div>
</section>

<section id="dramas">
  <div class="container">
    <h2>🎬 精品短剧</h2>
    <div class="tags" id="dramaTags"></div>
    <div class="grid" id="dramaList"></div>
  </div>
</section>

<section id="rank">
  <div class="container">
    <h2>🏆 排行榜</h2>
    <div class="rank">
      <div>
        <h3>小说 TOP10</h3>
        <ol id="novelRank"></ol>
      </div>
      <div>
        <h3>短剧 TOP10</h3>
        <ol id="dramaRank"></ol>
      </div>
    </div>
  </div>
</section>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" id="modalClose">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="reader" id="reader">
  <div class="reader-header">
    <span id="readerTitle"></span>
    <button id="readerClose">×</button>
  </div>
  <div class="reader-body" id="readerBody"></div>
</div>

<footer class="footer">
  数据来源：起点中文网 / 番茄小说 / 抖音 / DataEye
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
